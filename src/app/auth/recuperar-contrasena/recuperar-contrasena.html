<div class="flex min-h-screen">
  <app-panel-marca class="w-[52.8%] shrink-0">
    <h1 class="text-[32px] font-bold text-white">Recupera el acceso a tu panel</h1>
    <p class="text-lg leading-7 text-menu">Te enviaremos un enlace seguro al correo con el que registraste el taller.</p>
  </app-panel-marca>

  <section class="flex flex-1 items-center justify-center px-8 py-8">
    <form class="tarjeta flex w-[480px] flex-col gap-5 p-10">
      <a class="flex cursor-pointer items-center gap-2 text-sm font-medium text-petroleo"><img src="icons/flecha-izquierda.svg" alt="" class="size-4" />Volver a iniciar sesión</a>
      <span class="flex size-[72px] items-center justify-center rounded-full bg-azul-fondo"><img src="icons/candado-petroleo.svg" alt="" class="size-[34px]" /></span>
      <div class="flex flex-col gap-2">
        <h2 class="text-[26px] font-bold text-marino">¿Has olvidado la contraseña?</h2>
        <p class="text-[15px] leading-[22px] text-texto-suave">Escribe el correo del taller y te enviaremos un enlace para crear una nueva.</p>
      </div>
      <label>
        <span class="etiqueta">Correo del taller</span>
        <span class="campo flex items-center gap-2.5"><img src="icons/correo.svg" alt="" class="size-[18px]" /><input type="email" class="w-full outline-none placeholder:text-[#8a969c]" placeholder="taller@correo.com" /></span>
      </label>
      <button type="button" class="btn-primario">Enviar enlace</button>
    </form>
  </section>
</div>
