<div class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden bg-marino px-8 py-14">
  <!-- Fondo: brillos de color y logo grande difuminado -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 select-none">
    <div class="absolute -top-40 -left-40 size-[560px] rounded-full bg-petroleo opacity-60 blur-3xl"></div>
    <div class="absolute -right-32 -bottom-48 size-[520px] rounded-full bg-naranja opacity-25 blur-3xl"></div>

    <div class="absolute inset-0 flex items-center justify-center gap-10 opacity-20 blur-sm">
      <div class="flex size-52 shrink-0 items-center justify-center rounded-[56px] bg-naranja">
        <img src="icons/logo-llave.svg" alt="" class="size-32" />
      </div>
      <p class="text-[180px] leading-none font-bold whitespace-nowrap text-white">Repair<span class="text-naranja-claro">Link</span></p>
    </div>
  </div>

  <!-- Tarjeta de acceso centrada -->
  <div class="relative flex flex-col items-center gap-8">
    <div class="flex items-center gap-2.5">
      <div class="flex h-9 items-center justify-center overflow-clip rounded-[10.08px] bg-naranja">
        <span class="relative block size-5">
          <img src="icons/logo-llave.svg" alt="" class="absolute top-[0.83px] left-[1.66px] max-w-none" />
        </span>
      </div>
      <p class="text-xl font-bold whitespace-nowrap text-white">Repair<span class="text-naranja-claro">Link</span></p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="entrar()" class="tarjeta flex w-[420px] max-w-full flex-col gap-5 border-0 p-10 shadow-2xl">
      <div class="flex flex-col gap-1.5">
        <h2 class="text-[28px] font-bold text-marino">Acceso para talleres</h2>
        <p class="text-[15px] text-texto-suave">Entra en el panel de tu taller</p>
      </div>

      @if (error()) {
        <p class="rounded-xl bg-rojo-fondo px-4 py-3 text-sm text-rojo">⚠ {{ error() }}</p>
      }

      <label>
        <span class="etiqueta">Correo del taller</span>
        <input type="email" formControlName="email" class="campo" placeholder="taller@correo.com" />
        @if (loginForm.controls.email.touched && loginForm.controls.email.hasError('required')) {
          <p class="mt-1.5 text-sm text-rojo">⚠ Escribe el correo.</p>
        }
        @if (loginForm.controls.email.touched && loginForm.controls.email.hasError('email')) {
          <p class="mt-1.5 text-sm text-rojo">⚠ El correo no es válido.</p>
        }
      </label>

      <label>
        <span class="etiqueta">Contraseña</span>
        <input type="password" formControlName="password" class="campo" placeholder="••••••••" />
        @if (loginForm.controls.password.touched && loginForm.controls.password.hasError('required')) {
          <p class="mt-1.5 text-sm text-rojo">⚠ Escribe la contraseña.</p>
        }
        @if (loginForm.controls.password.touched && loginForm.controls.password.hasError('minlength')) {
          <p class="mt-1.5 text-sm text-rojo">⚠ La contraseña tiene al menos 8 caracteres.</p>
        }
      </label>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-[#33444d]">
          <input type="checkbox" class="size-[18px] accent-petroleo" />Recordarme
        </label>
        <a routerLink="/recuperar" class="cursor-pointer font-semibold text-marino">¿Has olvidado la contraseña?</a>
      </div>

      <button type="submit" class="btn-naranja" [disabled]="loginForm.invalid || enviando()">
        @if (enviando()) {
          Entrando...
        } @else {
          Entrar
        }
      </button>

      <p class="text-center text-sm text-texto-suave">¿Tu taller aún no está en RepairLink? <a routerLink="/registro" class="cursor-pointer font-semibold text-marino">Regístralo</a></p>
    </form>

    <p class="text-sm text-menu-suave">¿Eres cliente? Descarga la app de RepairLink para Android.</p>
  </div>
</div>
