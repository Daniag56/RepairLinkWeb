<div class="flex flex-col gap-6 px-10 pt-8 pb-10">
  <header class="flex items-end justify-between">
    <div class="flex flex-col gap-1 whitespace-nowrap">
      <p class="text-sm text-texto-suave">{{ coches.length }} coches · {{ listos }} listos para entregar</p>
      <h1 class="text-[30px] font-bold text-marino">Coches en el taller</h1>
    </div>
    <button type="button" class="btn-primario">+ Aceptar coche</button>
  </header>

  <div class="flex items-center gap-2">
    <button type="button" class="chip-activo">Todos · {{ coches.length }}</button>
    <button type="button" class="chip-inactivo">En revisión · 2</button>
    <button type="button" class="chip-inactivo">Esperando presupuesto · 1</button>
    <button type="button" class="chip-inactivo">Piezas en camino · 1</button>
    <button type="button" class="chip-inactivo">En reparación · 1</button>
    <button type="button" class="chip-inactivo">Listos · {{ listos }}</button>
  </div>

  <section class="tarjeta flex flex-col">
    <div class="flex h-10 items-center gap-4 border-b border-separador px-6 text-xs font-bold text-texto-suave">
      <span class="w-[250px] shrink-0">VEHÍCULO</span><span class="w-[160px] shrink-0">CLIENTE</span><span class="w-[250px] shrink-0">TRABAJO</span><span class="w-[170px] shrink-0">ESTADO</span><span class="w-[90px] shrink-0">ENTRADA</span>
    </div>

    @for (coche of coches; track coche.id; let ultimo = $last) {
      <app-fila-coche class="border-separador" [class.border-b]="!ultimo" [coche]="coche" (seleccionar)="onSeleccionarCoche($event)" />
    } @empty {
      <app-sin-resultados titulo="No hay coches en el taller" descripcion="Cuando aceptes un coche aparecerá aquí." />
    }
  </section>
</div>
