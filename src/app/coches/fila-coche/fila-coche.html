<button type="button" class="flex h-[65px] w-full cursor-pointer items-center gap-4 px-6 text-left text-sm text-texto" (click)="onClickFila()">
  <span class="flex w-[250px] shrink-0 items-center gap-3">
    <span class="flex size-10 shrink-0 items-center justify-center rounded-[10px] bg-azul-fondo"><img src="icons/coche.svg" alt="" class="size-[18px]" /></span>
    <span class="flex flex-col gap-0.5"><span class="font-semibold">{{ coche().marca }} {{ coche().modelo }}</span><span class="text-xs text-texto-suave">{{ coche().matricula }}</span></span>
  </span>
  <span class="w-[160px] shrink-0">{{ coche().cliente }}</span>
  <span class="w-[250px] shrink-0">{{ coche().trabajo }}</span>
  <span class="w-[170px] shrink-0"><span [class]="estados[coche().estado].badge">{{ estados[coche().estado].texto }}</span></span>
  <span class="w-[90px] shrink-0">{{ coche().fechaEntrada | date: 'dd/MM/yyyy' }}</span>
  <img src="icons/chevron-derecha.svg" alt="" class="ml-auto" />
</button>
