<div class="rounded-xl border border-separador bg-white p-5">

  <div class="mb-5 flex items-center justify-between">
    <h2 class="text-lg font-bold capitalize text-marino">
      {{ nombreMes }}
    </h2>

    <div class="flex gap-2">
      <button
        type="button"
        (click)="mesAnterior()"
        class="rounded-lg border border-separador px-3 py-2 text-sm text-marino hover:bg-fondo"
        aria-label="Mes anterior"
      >
        ‹
      </button>

      <button
        type="button"
        (click)="mesSiguiente()"
        class="rounded-lg border border-separador px-3 py-2 text-sm text-marino hover:bg-fondo"
        aria-label="Mes siguiente"
      >
        ›
      </button>
    </div>
  </div>

  <div class="grid grid-cols-7 gap-2">
    @for (dia of diasSemana; track dia) {
      <div class="py-2 text-center text-xs font-semibold text-texto-suave">
        {{ dia }}
      </div>
    }
  </div>

  <div class="grid grid-cols-7 gap-2">
    @for (dia of dias; track dia.fecha.toISOString()) {
      <button
        type="button"
        (click)="seleccionarDia(dia)"
        [disabled]="!dia.esMesActual"
        class="flex min-h-16 flex-col items-center justify-center gap-1 rounded-lg border p-2 transition-colors"
        [class.border-transparent]="!dia.esMesActual"
        [class.text-gray-300]="!dia.esMesActual"
        [class.border-separador]="dia.esMesActual && !esSeleccionado(dia)"
        [class.bg-petroleo]="esSeleccionado(dia)"
        [class.text-white]="esSeleccionado(dia)"
        [class.hover:bg-fondo]="dia.esMesActual && !esSeleccionado(dia)"
      >
        <span class="text-sm font-semibold">
          {{ dia.numero }}
        </span>

        @if (dia.esMesActual) {
          <span
            class="h-2 w-2 rounded-full"
            [class.bg-verde]="dia.estado === 'libre' && !esSeleccionado(dia)"
            [class.bg-naranja]="dia.estado === 'pocas' && !esSeleccionado(dia)"
            [class.bg-red-500]="dia.estado === 'completo' && !esSeleccionado(dia)"
            [class.bg-white]="esSeleccionado(dia)"
          ></span>
        }
      </button>
    }
  </div>


  <div class="mt-5 flex flex-wrap gap-4 text-xs text-texto-suave">
    <div class="flex items-center gap-2">
      <span class="h-2 w-2 rounded-full bg-verde"></span>
      Libre
    </div>

    <div class="flex items-center gap-2">
      <span class="h-2 w-2 rounded-full bg-naranja"></span>
      Pocas horas
    </div>

    <div class="flex items-center gap-2">
      <span class="h-2 w-2 rounded-full bg-red-500"></span>
      Completo
    </div>
  </div>
</div>
