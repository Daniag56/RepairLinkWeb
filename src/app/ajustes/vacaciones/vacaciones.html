<div class="flex items-start gap-6">
  <form class="tarjeta flex min-w-0 flex-1 flex-col gap-[18px] p-6">
    <h2 class="text-lg font-bold text-marino">Nuevo periodo de vacaciones</h2>
    <div class="flex gap-4">
      <label class="min-w-0 flex-1">
        <span class="etiqueta">Desde</span>
        <span class="campo flex items-center gap-2.5 text-[#8a969c]"><img src="icons/calendario.svg" alt="" class="size-[18px]" />dd/mm/aaaa</span>
      </label>
      <label class="min-w-0 flex-1">
        <span class="etiqueta">Hasta</span>
        <span class="campo flex items-center gap-2.5 text-[#8a969c]"><img src="icons/calendario.svg" alt="" class="size-[18px]" />dd/mm/aaaa</span>
      </label>
    </div>
    <label>
      <span class="etiqueta">Mensaje para los clientes</span>
      <input type="text" class="campo" placeholder="Ej.: Cerrado por vacaciones" />
    </label>
    <div class="flex h-14 items-center justify-between rounded-xl bg-fondo px-4">
      <span class="text-[15px] text-texto">Avisar a los clientes con cita esos días</span>
      <span class="interruptor-on"></span>
    </div>
    <div class="flex justify-end">
      <button type="button" class="btn-primario">Programar vacaciones</button>
    </div>
  </form>

  <section class="flex w-[420px] shrink-0 flex-col gap-3.5">
    <h2 class="text-lg font-bold text-marino">Programadas</h2>
    <div class="tarjeta flex h-[82px] items-center gap-3.5 px-[19px]">
      <span class="flex size-11 shrink-0 items-center justify-center rounded-[10px] bg-azul-fondo"><img src="icons/calendario-petroleo.svg" alt="" class="size-[22px]" /></span>
      <div class="flex min-w-0 flex-1 flex-col gap-0.5 whitespace-nowrap">
        <p class="text-[15px] font-semibold text-texto">24 dic – 6 ene</p>
        <p class="text-[13px] text-texto-suave">Cierre de Navidad · 2 citas avisadas</p>
      </div>
      <span class="badge-azul shrink-0">Activo</span>
    </div>
  </section>
</div>
